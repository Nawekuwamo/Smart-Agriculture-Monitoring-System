<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Agriculture Monitoring System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container"><a class="navbar-brand" href="index.html">Smart Agriculture</a></div>
  </nav>
  <main class="container py-4">
    <h1 class="mb-3">Monitoring Dashboard</h1>
    <p class="text-muted">Live soil and irrigation readings will appear here when the backend and ESP32 are connected.</p>
    <div class="row g-3">
      <div class="col-md-4"><div class="card p-3"><h2 class="h5">Soil moisture</h2><p id="moisture">-- %</p></div></div>
      <div class="col-md-4"><div class="card p-3"><h2 class="h5">Soil status</h2><p id="soilStatus">Waiting for data</p></div></div>
      <div class="col-md-4"><div class="card p-3"><h2 class="h5">Water pump</h2><p id="pumpStatus">Unknown</p></div></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
